[project]
name = "quant"
version = "0.1.0"
description = "Motore di backtesting event-driven per strategie su azioni/ETF con barre daily"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "duckdb",
    "yfinance",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
