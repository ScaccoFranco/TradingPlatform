[project]
name = "quant"
version = "0.1.0"
description = "Motore di backtesting event-driven per strategie su azioni/ETF con barre daily"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "yfinance",
    "matplotlib",
    "alpaca-py",
    "apscheduler",
    "pydantic-settings",
    "structlog",
    "requests",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "hypothesis",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["quant"]
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "alpaca.*", "apscheduler.*", "matplotlib.*", "structlog.*", "pandas.*", "requests.*"]
ignore_missing_imports = true
