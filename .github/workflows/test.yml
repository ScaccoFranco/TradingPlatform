name: test

on:
  push:
  pull_request:

jobs:
  qualita:
    runs-on: ubuntu-latest
    env:
      QUANT_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4

      - name: Installa uv e Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Dipendenze
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy quant

      - name: Pytest
        run: uv run pytest -q
